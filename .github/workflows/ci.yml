name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Install dependencies (cached)
        uses: ramsey/composer-install@v3
        with:
          dependency-cache: 'yes'
          cache-key: composer-php${{ matrix.php-version }}

      - name: Run tests
        run: composer testdox

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies (cached)
        uses: ramsey/composer-install@v3
        with:
          dependency-cache: 'yes'
          cache-key: composer-php8.5

      - name: Run PHPStan (level max)
        run: composer stan

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MIN_COVERAGE: '90'
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: xdebug

      - name: Install dependencies (cached)
        uses: ramsey/composer-install@v3
        with:
          dependency-cache: 'yes'
          cache-key: composer-php8.5

      - name: Run tests with coverage (clover)
        run: composer test:coverage

      - name: Enforce coverage threshold
        uses: johanvanhelden/gha-clover-test-coverage-check@v1
        with:
          percentage: ${{ env.MIN_COVERAGE }}
          filename: coverage/clover.xml

      - name: Generate coverage badge
        uses: timkrase/phpunit-coverage-badge@v1.2.1
        with:
          report: coverage/clover.xml
          report_type: clover
          coverage_badge_path: output/coverage.svg
          push_badge: false

      - name: Publish badge to gh-pages branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./output
          destination_dir: .
